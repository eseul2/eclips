<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>글삭제</title>
<style>
	table {
		margin: auto;
		width: 800px;
		border-radius: 5px;  
		border-collapse: collapse; 
		border-top: none;	
	}
</style>
</head>
<body>
<script>

function check() {
	
	
	var fm = document.frm;
	
	if(fm.pass.value == "") {
		alert("비밀번호를 입력해주세요");
		fm.pass.focus(); 
		return;
	} 

	var ans = confirm("삭제하시겠습니까?");
	
	if(ans == true) {	
		fm.action="Board.html"; 
		fm.method="post";
		fm.submit();	
	}
	
	 alert("삭제되었습니다!");
		return; 
}

</script>
<form name="frm">
<h2>글삭제</h2>
<hr>

<table>
	<tr>
		<td style="text-align:center">비밀번호<input type="password" name="pass"></td>
	</tr>
	
	<tr>
		<td><input type ="submit" value="삭제" onclick="check()"></td>
		<td><input type ="submit" value="취소" onclick="alert('취소되었습니다.')"></td>
	</tr>
	
</table>
</form>
</body>
</html>
