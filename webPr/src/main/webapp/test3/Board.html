<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>글 목록</title>
<style>
.main {
	margin : auto;
	width: 800px;
	border-radius: 5px;  /* 모서리를 둥글게  */
	border-collapse: collapse; /* 테이블 셀의 경계선 겹쳐서 하나로 표시.  */
	border-top: none;	/* 상단 경계선 없애기  */
}


.main td, .main tr {
	border-bottom: 1px lightgray solid; /* 테이블 하단 테두리 설정 */
	height: 30px;  /* 테이블 높이 지정 */
	font-size: 14px; /* 텍스트 크기 */ 
}


/* #title {
float: right;
}


#writing {
float: right; 
}
  */
 
.body {
	text-align: center;
}

button {
width : 40px;
height : 20px;
font-size : 14px;
border: 0;
background-color : black;
color : white;
}


#writing {
width : 50px;
height : 20px;
font-size : 12px;
border: 0;
background-color : black;
color : white;

}
</style>
</head>
<body>
<h2>글목록</h2>

<hr>

<form name = "frm">
<table id="title">
	<tr>
	<td>
	<select name="title" style="width:100px;" >
	<option value = "제목">제목</option>
	</select>
	</td>
	<td><input type="text" name="search"></td>
	<td><button type="button" onclick= "location.href='Board.html'">검색</button></td>
	</tr>
</table>



<table class="main" >
	<tr>
	<td style="text-align:center;">No</td>
	<td style="text-align:center;">제목</td>
	<td style="text-align:center;">작성자</td>
	<td style="text-align:center;">조회</td>
	<td style="text-align:center;">날짜</td>
	</tr>


<script>
for(let i = 10; i > 0; i-- ){
	document.write("<tr class='body'>");
	document.write("<td>"+ i + "</td>");
	document.write("<td>" + "제목입니다." + "</td>");
	document.write("<td>" + "작성자" + "</td>");
	document.write("<td>" + "5" + "</td>");
	document.write("<td>" + "24-10-12" + "</td>");
	document.write("</tr>");
}


</script>
</table>
</form>

<table>
	<tr>
	<td> <button type="button" id="writing" 
	onclick="location.href='writing.html'">글쓰기</button></td>
	</tr>
</table>








</body>
</html>
